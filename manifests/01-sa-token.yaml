# Fix 01: stop mounting the ServiceAccount token into the pod.
# The app does not talk to the API server, so it has no reason to carry a token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: app
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
